# Runs lint, typecheck, test, and build checks on PRs.
# Skips draft PRs to save CI resources.

name: PR Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Cancel previous runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE: 22
  NEXT_PUBLIC_DATA_VISUALIZATION_URL: ${{ vars.NEXT_PUBLIC_DATA_VISUALIZATION_URL }}
  NEXT_PUBLIC_STAC_API_URL: ${{ vars.NEXT_PUBLIC_STAC_API_URL }}
  NEXT_PUBLIC_RASTER_API_URL: ${{ vars.NEXT_PUBLIC_RASTER_API_URL }}

jobs:
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci

  typecheck:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    if: github.event.pull_request.draft == false
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
